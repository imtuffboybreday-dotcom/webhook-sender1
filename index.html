<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Webhook Sender</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#07090f;color:#fff}
body{background:radial-gradient(circle at 15% 10%,#182b52 0,transparent 32%),radial-gradient(circle at 85% 90%,#17183b 0,transparent 30%),#07090f;padding:18px}
.app{max-width:760px;margin:auto}
.card{background:rgba(14,17,27,.94);border:1px solid #242b3c;border-radius:18px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
h1{font-size:22px;margin:0 0 16px}
.section{border:1px solid #242b3c;background:#0c1019;border-radius:14px;padding:14px;margin-top:12px}
label{display:block;font-size:12px;color:#8993a8;margin:0 0 7px}
input,textarea{width:100%;border:1px solid #293247;background:#090d15;color:#fff;border-radius:10px;padding:11px 12px;outline:none;font-size:14px;margin-bottom:11px}
input:focus,textarea:focus{border-color:#4d8dff}
textarea{min-height:105px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#cbd2df;margin:4px 0}
.check input{width:auto;margin:0}
button{position:relative;overflow:hidden;width:100%;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,#5865f2,#3478ff);color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin-top:5px}
button:active{transform:scale(.985)}
.smallbtn{padding:10px;background:#151b29;border:1px solid #293247}
.delete,.edit,.stop{width:auto;padding:7px 10px;background:#171b25;border:1px solid #303849}
.edit{background:#18233a;border-color:#304a78}
.stop{background:#27151b;border-color:#56303a}
.ripple{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%);pointer-events:none;animation:ripple .42s ease-out forwards}
@keyframes ripple{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(15)}}
.status{font-size:12px;color:#8f9ab0;margin-top:10px;text-align:center;min-height:16px}
.preview-title{font-size:12px;color:#8993a8;margin-bottom:8px}
.profile{position:relative;overflow:hidden;border:1px solid #2a3142;border-radius:14px;background:#0b0e16}
.banner{height:115px;background:#1a2030 center/cover no-repeat}
.profile-body{padding:0 14px 14px;position:relative}
.avatar{width:68px;height:68px;border-radius:50%;border:4px solid #0b0e16;object-fit:cover;margin-top:-34px;background:#111827}
.username{font-size:15px;font-weight:700;margin-top:6px}
.embed{margin-top:12px;border-left:4px solid #5865f2;background:#11151f;border-radius:5px;padding:12px}
.embed-title{font-weight:700;font-size:15px;margin-bottom:7px}
.embed-desc{font-size:13px;color:#c8cfdb;white-space:pre-wrap}
.thumb{float:right;width:72px;height:72px;object-fit:cover;border-radius:7px;display:none;margin-left:10px}
.footer{font-size:11px;color:#747f94;margin-top:10px}
.clear{clear:both}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:15px;z-index:20}
.modal.show{display:flex}
.modalbox{width:100%;max-width:430px;background:#0d111b;border:1px solid #293247;border-radius:16px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.6)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modalhead strong{font-size:17px}
.close{width:auto;margin:0;padding:7px 11px;background:#151b29;border:1px solid #293247}
.search{margin-bottom:10px}
.configlist{max-height:55vh;overflow:auto}
.configitem{display:flex;align-items:center;gap:7px;background:#101622;border:1px solid #242d40;border-radius:10px;padding:10px;margin-bottom:8px}
.configname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;flex:1}
.empty{font-size:12px;color:#69748a;text-align:center;padding:20px}
.savebuttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cancel{background:#151b29;border:1px solid #293247}
.confirmtext{font-size:14px;color:#aeb7c8;margin-bottom:15px}
.autoStatus{font-size:12px;color:#7f8aa0;text-align:center;margin-top:9px;min-height:16px}
@media(max-width:520px){
body{padding:10px}
.card{padding:12px;border-radius:15px}
.row{grid-template-columns:1fr}
.banner{height:95px}
}
</style>
</head>
<body>

<div class="app">
<div class="card">

<h1>Webhook Sender</h1>

<div class="section">
<button class="smallbtn" id="openConfig">CONFIG</button>
<button class="smallbtn" id="openAutomation">AUTOMATION SENDER</button>
</div>

<div class="section">
<label>WEBHOOK URL</label>
<input id="webhook" type="url" placeholder="https://discord.com/api/webhooks/...">

<label>USERNAME</label>
<input id="username" placeholder="Webhook">

<label>AVATAR URL</label>
<input id="avatar" type="url" placeholder="https://example.com/avatar.png">

<label>BANNER URL</label>
<input id="banner" type="url" placeholder="https://example.com/banner.png">
</div>

<div class="section">
<label>EMBED TITLE</label>
<input id="title" placeholder="Title">

<label>MESSAGE</label>
<textarea id="message" placeholder="Write your message..."></textarea>

<div class="row">
<div>
<label>THUMBNAIL URL</label>
<input id="thumbnail" type="url" placeholder="https://example.com/thumb.png">
</div>
<div>
<label>EMBED COLOR</label>
<input id="color" type="color" value="#5865F2">
</div>
</div>

<label>FOOTER</label>
<input id="footer" placeholder="Footer">

<label class="check">
<input id="timestamp" type="checkbox">
Timestamp
</label>

<label class="check">
<input id="plain" type="checkbox">
Plain Message
</label>
</div>

<div class="section">
<div class="row">
<div>
<label>REPEAT</label>
<input id="repeat" type="number" value="1" min="1" max="20">
</div>
<div>
<label>DELAY (SECONDS)</label>
<input id="delay" type="number" value="5" min="1" max="3600">
</div>
</div>

<button id="send">SEND WEBHOOK</button>
<div class="status" id="status"></div>
</div>

<div class="section">
<div class="preview-title">PREVIEW</div>

<div class="profile">
<div class="banner" id="previewBanner"></div>

<div class="profile-body">
<img class="avatar" id="previewAvatar">

<div class="username" id="previewUsername">Webhook</div>

<div class="embed" id="previewEmbed">
<img class="thumb" id="previewThumb">

<div class="embed-title" id="previewTitle">Title</div>
<div class="embed-desc" id="previewDesc">Write your message...</div>
<div class="clear"></div>
<div class="footer" id="previewFooter"></div>
</div>

</div>
</div>
</div>

</div>
</div>

<div class="modal" id="configModal">
<div class="modalbox">

<div class="modalhead">
<strong>Configs</strong>
<button class="close" id="closeConfig">×</button>
</div>

<input class="search" id="configSearch" placeholder="Search config...">

<div class="configlist" id="configList"></div>

<button id="newConfig" class="smallbtn">NEW CONFIG</button>

</div>
</div>

<div class="modal" id="editModal">
<div class="modalbox">

<div class="modalhead">
<strong>Edit Config</strong>
<button class="close" id="closeEdit">×</button>
</div>

<div class="confirmtext">
Edit the settings saved in this config.
</div>

<div class="savebuttons">
<button id="saveEdit">SAVE</button>
<button id="cancelEdit" class="cancel">CANCEL</button>
</div>

</div>
</div>

<div class="modal" id="newModal">
<div class="modalbox">

<div class="modalhead">
<strong>Config Name</strong>
<button class="close" id="closeNew">×</button>
</div>

<input id="configName" placeholder="Config Name">

<div class="savebuttons">
<button id="saveNew">SAVE</button>
<button id="cancelNew" class="cancel">CANCEL</button>
</div>

</div>
</div>

<div class="modal" id="confirmModal">
<div class="modalbox">

<div class="modalhead">
<strong>Really bro?</strong>
</div>

<div class="confirmtext">
Cancel without saving your changes?
</div>

<div class="savebuttons">
<button id="confirmYes">YES</button>
<button id="confirmNo" class="cancel">NO</button>
</div>

</div>
</div>

<div class="modal" id="automationModal">
<div class="modalbox">

<div class="modalhead">
<strong>Automation Sender</strong>
<button class="close" id="closeAutomation">×</button>
</div>

<label>INTERVAL (SECONDS)</label>
<input id="autoInterval" type="number" min="1" max="3600" value="10">

<label>MAX SENDS</label>
<input id="autoCount" type="number" min="1" max="20" value="5">

<div class="savebuttons">
<button id="startAutomation">START</button>
<button id="stopAutomation" class="stop">STOP</button>
</div>

<div class="autoStatus" id="autoStatus"></div>

</div>
</div>

<script>
const $=id=>document.getElementById(id);

const defaults={
avatar:"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300",
banner:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1200"
};

const fields=[
"webhook","username","avatar","banner","title","message",
"thumbnail","color","footer","timestamp","plain","repeat","delay"
];

let configs=JSON.parse(localStorage.getItem("webhook_configs")||"{}");
let editingConfig=null;
let beforeEdit=null;
let automationRunning=false;

$("previewAvatar").src=defaults.avatar;
$("previewBanner").style.backgroundImage=`url("${defaults.banner}")`;

function getData(){
const data={};
fields.forEach(id=>{
const el=$(id);
data[id]=el.type==="checkbox"?el.checked:el.value;
});
return data;
}

function setData(data){
fields.forEach(id=>{
const el=$(id);
if(!(id in data))return;
if(el.type==="checkbox")el.checked=!!data[id];
else el.value=data[id];
});
update();
}

function update(){
const avatar=$("avatar").value.trim();
const banner=$("banner").value.trim();
const username=$("username").value.trim();
const title=$("title").value;
const message=$("message").value;
const thumb=$("thumbnail").value.trim();
const footer=$("footer").value;
const color=$("color").value;

$("previewAvatar").src=avatar||defaults.avatar;

$("previewBanner").style.backgroundImage=
banner?`url("${banner}")`:`url("${defaults.banner}")`;

$("previewUsername").textContent=username||"Webhook";
$("previewTitle").textContent=title||"Title";
$("previewDesc").textContent=message||"Write your message...";
$("previewEmbed").style.borderLeftColor=color;

if(thumb){
$("previewThumb").src=thumb;
$("previewThumb").style.display="block";
}else{
$("previewThumb").style.display="none";
}

$("previewFooter").textContent=footer||"";
$("previewEmbed").style.display=$("plain").checked?"none":"block";
}

fields.forEach(id=>{
$(id).addEventListener("input",update);
$(id).addEventListener("change",update);
});

function openModal(id){
$(id).classList.add("show");
}

function closeModal(id){
$(id).classList.remove("show");
}

function renderConfigs(filter=""){
const list=$("configList");
list.innerHTML="";

const names=Object.keys(configs)
.filter(name=>name.toLowerCase().includes(filter.toLowerCase()))
.sort((a,b)=>a.localeCompare(b));

if(!names.length){
list.innerHTML='<div class="empty">No configs found</div>';
return;
}

names.forEach(name=>{

const item=document.createElement("div");
item.className="configitem";

const text=document.createElement("div");
text.className="configname";
text.textContent=name;

text.onclick=()=>{
setData(configs[name]);
closeModal("configModal");
};

const edit=document.createElement("button");
edit.className="edit";
edit.textContent="EDIT";

edit.onclick=e=>{
e.stopPropagation();

editingConfig=name;
beforeEdit=JSON.parse(JSON.stringify(configs[name]));

setData(configs[name]);

closeModal("configModal");
openModal("editModal");
};

const del=document.createElement("button");
del.className="delete";
del.textContent="DELETE";

del.onclick=e=>{
e.stopPropagation();

if(confirm("Delete config \""+name+"\"?")){
delete configs[name];
localStorage.setItem("webhook_configs",JSON.stringify(configs));
renderConfigs($("configSearch").value);
}
};

item.append(text,edit,del);
list.appendChild(item);

});
}

$("openConfig").onclick=()=>{
renderConfigs();
openModal("configModal");
};

$("closeConfig").onclick=()=>{
closeModal("configModal");
};

$("configSearch").oninput=e=>{
renderConfigs(e.target.value);
};

$("newConfig").onclick=()=>{
editingConfig=null;
$("configName").value="";
closeModal("configModal");
openModal("newModal");
};

$("closeNew").onclick=()=>{
closeModal("newModal");
};

$("saveNew").onclick=()=>{
const name=$("configName").value.trim();

if(!name){
$("configName").focus();
return;
}

if(configs[name]){
$("configName").focus();
return;
}

configs[name]=getData();
localStorage.setItem("webhook_configs",JSON.stringify(configs));

closeModal("newModal");
renderConfigs();
openModal("configModal");
};

$("cancelNew").onclick=()=>{
closeModal("newModal");
openModal("confirmModal");
};

$("closeEdit").onclick=()=>{
closeModal("editModal");
};

$("saveEdit").onclick=()=>{
if(!editingConfig)return;

configs[editingConfig]=getData();

localStorage.setItem("webhook_configs",JSON.stringify(configs));

beforeEdit=JSON.parse(JSON.stringify(configs[editingConfig]));

closeModal("editModal");

renderConfigs();
openModal("configModal");
};

$("cancelEdit").onclick=()=>{
closeModal("editModal");
openModal("confirmModal");
};

$("confirmYes").onclick=()=>{
closeModal("confirmModal");

if(editingConfig&&beforeEdit){
setData(beforeEdit);
}

openModal("configModal");
};

$("confirmNo").onclick=()=>{
closeModal("confirmModal");

if(editingConfig){
openModal("editModal");
}else{
openModal("newModal");
}
};

function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

async function sendOnce(){

const webhook=$("webhook").value.trim();
const username=$("username").value.trim();
const avatar=$("avatar").value.trim();
const title=$("title").value;
const message=$("message").value;
const thumbnail=$("thumbnail").value.trim();
const footer=$("footer").value;
const color=$("color").value;
const timestamp=$("timestamp").checked;
const plain=$("plain").checked;

if(!webhook)throw new Error("Webhook URL required.");
if(!message&&!title)throw new Error("Message or title required.");

const payload={
username:username||"Webhook"
};

if(avatar)payload.avatar_url=avatar;

if(plain){

payload.content=message;

}else{

const embed={
color:parseInt(color.replace("#",""),16)
};

if(title)embed.title=title;
if(message)embed.description=message;
if(thumbnail)embed.thumbnail={url:thumbnail};
if(footer)embed.footer={text:footer};
if(timestamp)embed.timestamp=new Date().toISOString();

payload.embeds=[embed];

}

const res=await fetch(webhook,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
});

if(!res.ok)throw new Error("HTTP "+res.status);
}

$("send").onclick=async function(e){

const ripple=document.createElement("span");
ripple.className="ripple";

const rect=this.getBoundingClientRect();
ripple.style.left=(e.clientX-rect.left)+"px";
ripple.style.top=(e.clientY-rect.top)+"px";

this.appendChild(ripple);
setTimeout(()=>ripple.remove(),450);

let repeat=parseInt($("repeat").value)||1;
let delay=parseFloat($("delay").value)||1;

repeat=Math.max(1,Math.min(20,repeat));
delay=Math.max(1,Math.min(3600,delay));

this.disabled=true;
$("status").textContent="Sending...";

try{

for(let i=0;i<repeat;i++){

await sendOnce();

if(i<repeat-1)await sleep(delay*1000);

}

$("status").textContent="Sent successfully.";

}catch(err){

$("status").textContent="Failed: "+err.message;

}

this.disabled=false;
};

$("openAutomation").onclick=()=>{
$("autoStatus").textContent="";
openModal("automationModal");
};

$("closeAutomation").onclick=()=>{
closeModal("automationModal");
};

$("stopAutomation").onclick=()=>{
automationRunning=false;
$("autoStatus").textContent="Automation stopped.";
};

$("startAutomation").onclick=async()=>{

if(automationRunning)return;

let interval=parseFloat($("autoInterval").value)||10;
let count=parseInt($("autoCount").value)||5;

interval=Math.max(1,Math.min(3600,interval));
count=Math.max(1,Math.min(20,count));

try{

await sendOnce();

automationRunning=true;
$("autoStatus").textContent="Running...";

for(let i=1;i<count&&automationRunning;i++){

await sleep(interval*1000);

if(!automationRunning)break;

await sendOnce();

$("autoStatus").textContent=
"Sent "+(i+1)+"/"+count;

}

if(automationRunning){
$("autoStatus").textContent="Automation finished.";
}

}catch(err){

automationRunning=false;
$("autoStatus").textContent="Failed: "+err.message;

}

automationRunning=false;
};

update();
</script>

</body>
</html>
