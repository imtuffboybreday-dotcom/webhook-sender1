<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Webhook Sender</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#07090f;color:#fff}
body{
background:
radial-gradient(circle at 15% 10%,#182b52 0,transparent 32%),
radial-gradient(circle at 85% 90%,#17183b 0,transparent 30%),
#07090f;
padding:18px;
}
.app{max-width:760px;margin:auto}
.card{
background:rgba(14,17,27,.94);
border:1px solid #242b3c;
border-radius:18px;
padding:18px;
box-shadow:0 12px 40px rgba(0,0,0,.35);
}
h1{font-size:22px;margin:0 0 16px}
.section{
border:1px solid #242b3c;
background:#0c1019;
border-radius:14px;
padding:14px;
margin-top:12px;
}
label{
display:block;
font-size:12px;
color:#8993a8;
margin:0 0 7px;
}
input,textarea,select{
width:100%;
border:1px solid #293247;
background:#090d15;
color:#fff;
border-radius:10px;
padding:11px 12px;
outline:none;
font-size:14px;
margin-bottom:11px;
}
input:focus,textarea:focus{border-color:#4d8dff}
textarea{min-height:105px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
color:#cbd2df;
margin:4px 0;
}
.check input{width:auto;margin:0}
button{
position:relative;
overflow:hidden;
width:100%;
border:0;
border-radius:11px;
padding:13px;
background:linear-gradient(135deg,#5865f2,#3478ff);
color:white;
font-weight:700;
font-size:14px;
cursor:pointer;
margin-top:5px;
}
button:active{transform:scale(.985)}
.ripple{
position:absolute;
width:12px;height:12px;
border-radius:50%;
background:rgba(255,255,255,.45);
transform:translate(-50%,-50%);
pointer-events:none;
animation:ripple .42s ease-out forwards;
}
@keyframes ripple{
from{opacity:1;transform:translate(-50%,-50%) scale(1)}
to{opacity:0;transform:translate(-50%,-50%) scale(15)}
}
.status{
font-size:12px;
color:#8f9ab0;
margin-top:10px;
text-align:center;
min-height:16px;
}
.preview-title{
font-size:12px;
color:#8993a8;
margin-bottom:8px;
}
.profile{
position:relative;
overflow:hidden;
border:1px solid #2a3142;
border-radius:14px;
background:#0b0e16;
}
.banner{
height:115px;
background:#1a2030 center/cover no-repeat;
}
.profile-body{
padding:0 14px 14px;
position:relative;
}
.avatar{
width:68px;
height:68px;
border-radius:50%;
border:4px solid #0b0e16;
object-fit:cover;
margin-top:-34px;
background:#111827;
}
.username{
font-size:15px;
font-weight:700;
margin-top:6px;
}
.embed{
margin-top:12px;
border-left:4px solid #5865f2;
background:#11151f;
border-radius:5px;
padding:12px;
}
.embed-title{font-weight:700;font-size:15px;margin-bottom:7px}
.embed-desc{font-size:13px;color:#c8cfdb;white-space:pre-wrap}
.embed-media{
width:100%;
max-height:240px;
object-fit:cover;
border-radius:7px;
margin-top:10px;
display:none;
}
.thumb{
float:right;
width:72px;
height:72px;
object-fit:cover;
border-radius:7px;
display:none;
margin-left:10px;
}
.footer{
font-size:11px;
color:#747f94;
margin-top:10px;
}
.clear{clear:both}
@media(max-width:520px){
body{padding:10px}
.card{padding:12px;border-radius:15px}
.row{grid-template-columns:1fr}
.banner{height:95px}
}
</style>
</head>
<body>

<div class="app">
<div class="card">

<h1>Webhook Sender</h1>

<div class="section">
<label>WEBHOOK URL</label>
<input id="webhook" type="url" placeholder="https://discord.com/api/webhooks/...">

<label>USERNAME</label>
<input id="username" placeholder="Webhook">

<label>AVATAR URL</label>
<input id="avatar" type="url" placeholder="https://example.com/avatar.png">

<label>BANNER URL</label>
<input id="banner" type="url" placeholder="https://example.com/banner.png">
</div>

<div class="section">
<label>EMBED TITLE</label>
<input id="title" placeholder="Title">

<label>MESSAGE</label>
<textarea id="message" placeholder="Write your message..."></textarea>

<div class="row">
<div>
<label>THUMBNAIL URL</label>
<input id="thumbnail" type="url" placeholder="https://example.com/thumb.png">
</div>
<div>
<label>EMBED COLOR</label>
<input id="color" type="color" value="#5865F2">
</div>
</div>

<label>FOOTER</label>
<input id="footer" placeholder="Footer">

<label class="check">
<input id="timestamp" type="checkbox">
Timestamp
</label>

<label class="check">
<input id="plain" type="checkbox">
Plain Message
</label>
</div>

<div class="section">
<div class="row">
<div>
<label>REPEAT</label>
<input id="repeat" type="number" value="1" min="1" max="20">
</div>
<div>
<label>DELAY (SECONDS)</label>
<input id="delay" type="number" value="5" min="1" max="3600">
</div>
</div>

<button id="send">SEND WEBHOOK</button>
<div class="status" id="status"></div>
</div>

<div class="section">
<div class="preview-title">PREVIEW</div>

<div class="profile">
<div class="banner" id="previewBanner"></div>

<div class="profile-body">
<img class="avatar" id="previewAvatar">

<div class="username" id="previewUsername">Webhook</div>

<div class="embed" id="previewEmbed">
<img class="thumb" id="previewThumb">

<div class="embed-title" id="previewTitle">Title</div>
<div class="embed-desc" id="previewDesc">Write your message...</div>
<img class="embed-media" id="previewMedia">
<div class="clear"></div>

<div class="footer" id="previewFooter"></div>
</div>

</div>
</div>
</div>

</div>
</div>

<script>
const $=id=>document.getElementById(id);

const defaults={
avatar:"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300",
banner:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1200"
};

$("previewAvatar").src=defaults.avatar;
$("previewBanner").style.backgroundImage=`url("${defaults.banner}")`;

function update(){
const avatar=$("avatar").value.trim();
const banner=$("banner").value.trim();
const username=$("username").value.trim();
const title=$("title").value;
const message=$("message").value;
const thumb=$("thumbnail").value.trim();
const footer=$("footer").value;
const color=$("color").value;

$("previewAvatar").src=avatar||defaults.avatar;
$("previewBanner").style.backgroundImage=`url("${banner||defaults.banner}")`;

$("previewUsername").textContent=username||"Webhook";
$("previewTitle").textContent=title||"Title";
$("previewDesc").textContent=message||"Write your message...";
$("previewEmbed").style.borderLeftColor=color;

if(thumb){
$("previewThumb").src=thumb;
$("previewThumb").style.display="block";
}else{
$("previewThumb").style.display="none";
}

if(footer){
$("previewFooter").textContent=footer;
}else{
$("previewFooter").textContent="";
}

$("previewEmbed").style.display=$("plain").checked?"none":"block";
}

document.querySelectorAll("input,textarea").forEach(el=>{
el.addEventListener("input",update);
el.addEventListener("change",update);
});

$("plain").addEventListener("change",update);

function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

$("send").addEventListener("click",async function(e){

const ripple=document.createElement("span");
ripple.className="ripple";

const rect=this.getBoundingClientRect();
ripple.style.left=(e.clientX-rect.left)+"px";
ripple.style.top=(e.clientY-rect.top)+"px";

this.appendChild(ripple);
setTimeout(()=>ripple.remove(),450);

const webhook=$("webhook").value.trim();
const username=$("username").value.trim();
const avatar=$("avatar").value.trim();
const title=$("title").value;
const message=$("message").value;
const thumbnail=$("thumbnail").value.trim();
const footer=$("footer").value;
const color=$("color").value;
const timestamp=$("timestamp").checked;
const plain=$("plain").checked;

let repeat=parseInt($("repeat").value)||1;
let delay=parseFloat($("delay").value)||1;

repeat=Math.max(1,Math.min(20,repeat));
delay=Math.max(1,Math.min(3600,delay));

if(!webhook){
$("status").textContent="Webhook URL required.";
return;
}

if(!message&&!title){
$("status").textContent="Message or title required.";
return;
}

this.disabled=true;
$("status").textContent="Sending...";

try{

for(let i=0;i<repeat;i++){

const payload={
username:username||"Webhook"
};

if(avatar)payload.avatar_url=avatar;

if(plain){
payload.content=message;
}else{

const embed={
title:title||undefined,
description:message||undefined,
color:parseInt(color.replace("#",""),16)
};

if(thumbnail)embed.thumbnail={url:thumbnail};
if(footer)embed.footer={text:footer};
if(timestamp)embed.timestamp=new Date().toISOString();

payload.embeds=[embed];
}

const res=await fetch(webhook,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
});

if(!res.ok)throw new Error("HTTP "+res.status);

if(i<repeat-1)await sleep(delay*1000);
}

$("status").textContent="Sent successfully.";
}catch(err){
$("status").textContent="Failed: "+err.message;
}

this.disabled=false;
});

update();
</script>

</body>
</html>
